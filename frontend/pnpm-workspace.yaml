packages:
  - "."

# pnpm 11 requires every dependency install/build script to be explicitly reviewed
# in `allowBuilds`; unreviewed scripts make `pnpm install` fail with
# ERR_PNPM_IGNORED_BUILDS (this is what broke the Docker `pnpm install` step).
# This SPA's `vite build` and the nginx runtime need none of these native scripts:
# esbuild ships a prebuilt platform binary, and canvas/msw/protobufjs/workerd are
# never exercised at build time. So they are explicitly disallowed (not built).
# Flip one to `true` only if a build genuinely starts requiring it.
allowBuilds:
  canvas: false
  esbuild: false
  msw: false
  protobufjs: false
  workerd: false

# The SPA resolves Transformers through its browser export, which uses
# onnxruntime-web and browser image APIs. Its Node-only backends are not part of
# the shipped runtime and are removed from this package subtree.
overrides:
  "@huggingface/transformers>onnxruntime-node": "-"
  "@huggingface/transformers>sharp": "-"

minimumReleaseAgeExclude:
  - react-dom@19.2.8
  - react@19.2.8
