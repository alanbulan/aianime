appId: com.ai-anime.desktop
productName: AI anime
copyright: Copyright (c) 2026 AI anime
asar: true
directories:
  output: release
publish:
  provider: generic
  url: https://aianime.122-193-11-199.sslip.io/api/v1/client/releases/updater/
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../frontend/dist
    to: frontend
  - from: backend-dist/ai-anime-backend
    to: backend
  - from: runtime/ffmpeg
    to: bin
  - from: hermes-runtime/dist/hermes-acp
    to: hermes/hermes-acp
  - from: ../.hermes
    to: hermes-assets
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AI-anime-${version}-${arch}-setup.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.graphics-design
  identity: "-"
  hardenedRuntime: false
  minimumSystemVersion: 15.0.0
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: AI-anime-${version}-macos-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI anime
