[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ai-anime"
version = "1.1.63"
description = "AI anime desktop API and video pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Cognee 1.5.3 still uses LiteLLM 1.x, which requires OpenAI SDK <3.
    # Keep the main Pydantic AI runtime on the newest compatible line until
    # Cognee's text/embedding adapter can move off that transport constraint.
    "pydantic-ai-slim[anthropic,google,openai,openrouter]==2.31.1",
    "openai>=2.54.0,<3.0.0",
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pymysql>=1.1.0",
    "typer>=0.9.0",
    "click>=8.4.2",
    "rich>=14.3.4,<15.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
    "numpy>=2.4.6",
    "Pillow>=10.0.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.0",
    "python-docx>=1.1.0",
    "cognee==1.5.3",
    "litellm>=1.98.0",
    "nest-asyncio>=1.5.0",
    "celery>=5.4.0",
    "pypinyin>=0.55.0",
    "oss2>=2.19.1",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.0.0",
    "python-ulid>=2.2.0",
    "asyncpg>=0.30.0",
    "packaging>=24.2,<25.0.0",
    "portalocker>=3.2.0",
]

[project.scripts]
ai-anime = "ai_anime.cli:app"

[project.optional-dependencies]
world = [
    "sharp @ git+https://github.com/apple/ml-sharp.git",
    "da2 @ git+https://github.com/EnVision-Research/DA-2.git#subdirectory=src",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "timm>=1.0.20",
    "transformers>=5.15.1",
    "einops==0.8.2",
    "huggingface-hub>=1.28.0",
    "safetensors>=0.6.0",
    "plyfile>=1.1.2",
    "scipy>=1.16.0",
    "matplotlib>=3.10.0",
    "imageio>=2.37.0",
    "pillow-heif>=1.1.0",
    "jaxtyping>=0.3.0",
]

[tool.uv]
# Cognee selects Ladybug from the build host's kernel. Intel artifacts must
# retain its Ventura-compatible line even when built on macOS 15. Preserve
# Cognee's original selection on Windows, Linux and Apple Silicon.
override-dependencies = [
    "ladybug==0.17.1; sys_platform == 'darwin' and (platform_machine == 'x86_64' or 'Darwin Kernel Version 22.' in platform_version or 'Darwin Kernel Version 23.' in platform_version)",
    "ladybug==0.19.0; sys_platform != 'darwin' or (platform_machine != 'x86_64' and 'Darwin Kernel Version 22.' not in platform_version and 'Darwin Kernel Version 23.' not in platform_version)",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "fakeredis>=2.20.0",
    "respx>=0.22.0",
    "ruff==0.16.4",
]
desktop = [
    "faster-whisper==1.2.1",
    # ONNX Runtime 1.24+ no longer publishes Intel macOS wheels. 1.23.2 is the
    # final maintained line with a CPython 3.11 macOS x86_64 wheel and remains
    # within faster-whisper's supported >=1.14,<2 range.
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime==1.29.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # LanceDB 0.26+ stopped publishing Intel macOS wheels. Cognee accepts
    # >=0.24.3,<1.0.0, so retain the last Intel build only on that platform.
    "lancedb==0.25.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "lancedb==0.37.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pyinstaller>=6.22.2,<7.0.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# 显式冻结规则集为 ruff 默认（pycodestyle 错误 + pyflakes），
# 避免 ruff 升级引入新规则时门禁漂移。扩规则需单独 PR。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# ―――― 以下为存量豁免基线（2026-07-07 快照：196 处 / 61 文件）――――
# 门禁只管新增代码：新文件、以及下列文件中新增的其他规则违例会被拦截。
# 治理旧账时：修完某文件的某规则后删除对应条目，防止回潮。
"src/ai_anime/modules/production/infrastructure/global_video_optimizer.py" = ["F541"]
"src/ai_anime/modules/narrative_planning/infrastructure/keyframe_prompt_builder.py" = ["F541"]
"src/ai_anime/api/routes/asset_world/characters.py" = ["E402"]
"src/ai_anime/api/routes/asset_world/styles.py" = ["E402"]
"src/ai_anime/api/routes/narrative_planning/scripts.py" = ["E402"]
"src/ai_anime/api/routes/project_workspace/files.py" = ["E402"]
"src/ai_anime/modules/knowledge_graph/infrastructure/pipeline.py" = ["F541"]
"src/ai_anime/modules/knowledge_graph/infrastructure/store.py" = ["E402", "F541"]
"src/ai_anime/modules/production/infrastructure/media_generation/image_generator.py" = ["F541"]
"src/ai_anime/modules/production/infrastructure/media_generation/character_image_generator.py" = ["F541"]
"src/ai_anime/modules/production/infrastructure/media_generation/prop_image_generator.py" = ["F541"]
"src/ai_anime/modules/production/infrastructure/media_generation/pool_indexer.py" = ["F541"]
"src/ai_anime/modules/production/infrastructure/media_generation/tts_generator.py" = ["F541"]
"src/ai_anime/shared/utils/logging.py" = ["F541"]
"src/ai_anime/modules/verification/infrastructure/consistency_verifier.py" = ["E402"]
"tests/test_storyboard_prompt_visual_authority.py" = ["F541"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not ee and not e2e'"
norecursedirs = ["archive", "external", ".venv", "node_modules"]
markers = [
    "ee: enterprise-edition tests that may require control-plane modules",
    "e2e: end-to-end tests",
    "quarantine: temporarily isolated tests",
    "m01: OSS split module M01",
    "m02: OSS split module M02",
    "m03: OSS split module M03",
    "m04: OSS split module M04",
    "m05: OSS split module M05",
    "m06: OSS split module M06",
    "m07: OSS split module M07",
    "m08: OSS split module M08",
    "m09: OSS split module M09",
    "m10: OSS split module M10",
]

[[tool.uv.dependency-metadata]]
name = "da2"
version = "0.1.0"
requires-dist = []

# ml-sharp(`sharp`)上游依赖含 gsplat(渲染器,常需 CUDA 编译);SHARP 预测路径不用
# gsplat(已核:CE 与 sharp.models 均不 import 它)。这里覆盖 sharp 的依赖元数据、
# 去掉 gsplat,使 CPU/无 CUDA 环境(含 CE Docker)能干净安装;其余依赖原样保留。
[[tool.uv.dependency-metadata]]
name = "sharp"
version = "0.1"
requires-dist = [
    "click",
    "imageio",
    "matplotlib",
    "pillow-heif",
    "plyfile",
    "scipy",
    "timm",
    "torch",
    "torchvision",
]

[tool.ai_anime.external-tools.splat-transform]
description = "Compress generated 3DGS PLY assets to PlayCanvas SOG packages."
package-manager = "npm"
package = "@playcanvas/splat-transform"
version = "^3.3.3"
binary = "splat-transform"
install = "npm install -g @playcanvas/splat-transform@3.3.3"
env-override = "AI_ANIME_SPLAT_TRANSFORM_BIN"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_anime"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_anime/release-notes.md" = "ai_anime/release-notes.md"

[tool.hatch.metadata]
allow-direct-references = true
