version: "1.0"
name: desktop-quality-gate
displayName: Electron 桌面端质量验证
stages:
- stage:
  name: test_build
  displayName: 自动测试与前端测试版构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@gcc
    name: quality_gate
    displayName: Electron、前端与 Python 质量门
    gccVersion: 10.3
    commands:
    - |
      set -eu
      NODE_VERSION=24.19.0
      mkdir -p .ci-runtime
      wget -q "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz" -O ".ci-runtime/node-v${NODE_VERSION}-linux-x64.tar.gz"
      wget -q "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -O .ci-runtime/SHASUMS256.txt
      grep " node-v${NODE_VERSION}-linux-x64.tar.gz$" .ci-runtime/SHASUMS256.txt > .ci-runtime/node.sha256
      (cd .ci-runtime && sha256sum -c node.sha256)
      tar -xzf ".ci-runtime/node-v${NODE_VERSION}-linux-x64.tar.gz" -C .ci-runtime
      export PATH="${PWD}/.ci-runtime/node-v${NODE_VERSION}-linux-x64/bin:${HOME}/.local/bin:${PATH}"

      corepack enable
      corepack prepare pnpm@11.24.0 --activate
      wget -qO- https://astral.sh/uv/0.11.8/install.sh | sh
      node --version
      pnpm --version
      uv --version

      uv sync --locked --python 3.12
      pnpm --dir frontend install --frozen-lockfile
      uv run --locked ruff check src tests .hermes/plugins/ai_anime
      uv run --locked pytest tests -q
      pnpm --dir frontend test:browser:install --with-deps
      pnpm --dir frontend test
      pnpm --dir frontend typecheck
      pnpm --dir frontend build:ce
      pnpm --dir desktop install --frozen-lockfile
      pnpm --dir desktop test
      pnpm --dir desktop typecheck
    artifacts:
    - name: FRONTEND_TEST_BUILD
      path:
      - frontend/dist
      type: .tar.gz
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: auto
  push:
    branches:
      precise:
      - master
notify: []
strategy:
  blocking: true
