version: "1.0"
name: desktop-auto-version
displayName: Electron 桌面端自动版本与更新记录
stages:
- stage:
  name: version_release
  displayName: 自动递增版本
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: bump_patch_version
    displayName: 递增补丁版本并生成中英文更新记录
    nodeVersion: 15.12.0
    commands:
    - node --version
    - |
      set -eu
      CURRENT_SUBJECT=$(git log -1 --format=%s)
      case "${CURRENT_SUBJECT}" in
        "chore(release): 自动升级版本至 v"*)
          echo "当前提交是流水线生成的版本提交，不再次递增版本。"
          exit 0
          ;;
      esac

      if [ -z "${GITEE_PUSH_PRIVATE_KEY:-}" ]; then
        echo "缺少 Gitee Go 保密变量 GITEE_PUSH_PRIVATE_KEY，无法将自动版本提交写回仓库。"
        exit 2
      fi

      mkdir -p "${HOME}/.ssh"
      printf '%s\n' "${GITEE_PUSH_PRIVATE_KEY}" | tr -d '\r' > "${HOME}/.ssh/id_ed25519"
      chmod 600 "${HOME}/.ssh/id_ed25519"
      ssh-keyscan gitee.com >> "${HOME}/.ssh/known_hosts"
      git remote set-url origin git@gitee.com:mingcheng_software/ai-manga-desktop.git
      git checkout -B master
      node scripts/release/bump-version.mjs --patch --auto
      VERSION=$(node -p "require('./desktop/package.json').version")

      git config user.name "Gitee Go"
      git config user.email "noreply@gitee.com"
      git add README.md pyproject.toml uv.lock desktop/package.json frontend/vite.config.ts src/ai_anime/release-notes.md docs/cloud-integration-handoff.md
      git commit \
        -m "chore(release): 自动升级版本至 v${VERSION}" \
        -m "来源提交：${GITEE_COMMIT:-unknown}" \
        -m "流水线构建：${GITEE_PIPELINE_BUILD_NUMBER:-unknown}" \
        -m "已同步 Python、Electron、前端兜底版本、锁文件和中英文更新记录。"
      git push origin HEAD:master
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
triggers:
  trigger: auto
  push:
    branches:
      precise:
      - master
notify: []
strategy:
  blocking: true
